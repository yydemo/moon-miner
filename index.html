<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动端视口：禁止缩放，适配刘海屏 / Mobile viewport: no zoom, notch-safe -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="月球挖矿 Moon Miner — 发射火箭、登月、驾驶挖掘机采矿的 HTML5 小游戏 / Launch, land on the Moon and mine with a little excavator.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>月球挖矿 Moon Miner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== 基础样式 / Base styles ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#eef3ff}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}
/* ===== 顶部 HUD / Top HUD ===== */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);z-index:5}
#stats{font-size:13px;line-height:1.4;background:rgba(0,0,0,.42);padding:6px 9px;border-radius:9px;font-variant-numeric:tabular-nums}
#stats:empty{display:none}
#stats .ok{color:#7dff9a}#stats .bad{color:#ff7b7b}#stats .warn{color:#ffd166}
.bar{display:inline-block;width:64px;height:8px;border-radius:4px;background:#ffffff22;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:#7dff9a}
#topbtns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.tb{min-width:42px;height:42px;padding:0 10px;border-radius:11px;border:1px solid #ffffff33;background:rgba(0,0,0,.5);color:#fff;font-size:15px;font-weight:600}
.tb:active{background:#ffffff33}
.hide{display:none!important}
/* ===== 触屏按键 / Touch controls ===== */
#controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:4;
  padding:0 calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 14px)}
.pad{display:flex;gap:12px;align-items:flex-end}
.cb{pointer-events:auto;touch-action:none;width:clamp(60px,18vmin,94px);height:clamp(60px,18vmin,94px);border-radius:50%;
  border:2px solid #ffffff55;background:rgba(255,255,255,.13);color:#fff;font-weight:700;font-size:clamp(18px,5vmin,26px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.cb small{font-size:clamp(10px,2.8vmin,13px);font-weight:500;opacity:.9}
.cb.down{background:rgba(255,190,70,.5);border-color:#ffd166}
.cb.big{width:clamp(78px,24vmin,120px);height:clamp(78px,24vmin,120px)}
.cb.flash{animation:flash .5s infinite alternate;border-color:#ffd166}
@keyframes flash{from{background:rgba(255,120,40,.25)}to{background:rgba(255,200,60,.75)}}
/* ===== 弹层菜单 / Overlay screens ===== */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(3,5,16,.62);
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.panel{width:100%;max-width:440px;max-height:100%;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(14,22,48,.92);border:1px solid #5aa9ff55;border-radius:18px;padding:18px 18px 14px;box-shadow:0 10px 40px #0008;text-align:center}
.panel h1{margin:2px 0 4px;font-size:clamp(28px,8vmin,40px);letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#9ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{margin:4px 0 10px;font-size:22px}
.panel p{margin:6px 0;font-size:14px;line-height:1.55;color:#c9d6ff}
.sub{color:#9fb3e6;font-size:14px;margin-bottom:10px}
.mb{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:none;font-size:17px;font-weight:700;color:#0b1020;background:linear-gradient(180deg,#ffe08a,#ffb547)}
.mb.alt{background:#24345f;color:#e6eeff;border:1px solid #5aa9ff55}
.mb:active{transform:scale(.98)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ffffff14;text-align:left;font-size:14px}
.row b{font-size:15px}.row small{color:#9fb3e6}
.row button{flex:none;padding:9px 12px;border-radius:10px;border:none;background:#ffcf5c;color:#0b1020;font-weight:700;font-size:14px}
.row button:disabled{background:#3a4566;color:#8b97b8}
.kv{display:flex;justify-content:space-between;font-size:15px;padding:4px 2px}
.gold{color:#ffd166;font-weight:700}
.ach.lock{opacity:.45}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:92%}
.toast{background:rgba(10,16,40,.88);border:1px solid #ffd16688;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + clamp(86px,26vmin,140px));z-index:3;pointer-events:none;
  font-size:13px;color:#dfe8ff;background:rgba(0,0,0,.38);padding:5px 10px;border-radius:10px;max-width:86%;text-align:center}
#hint:empty{display:none}
#skip{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:6}

<body>
<canvas id="game" aria-label="Moon Miner game canvas"></canvas>

<!-- 顶部状态与按钮 / Top status and buttons -->
<div id="hud">
  <div id="stats"></div>
  <div id="topbtns">
    <button class="tb hide" id="btnEnd" data-i18n="end"></button>
    <button class="tb hide" id="btnPause" aria-label="pause">⏸</button>
    <button class="tb" id="btnMute" aria-label="mute">🔊</button>
    <button class="tb" id="btnLang" aria-label="language"></button>
  </div>
</div>
<div id="toasts"></div>
<div id="hint"></div>

<!-- 触屏按键（多点触控）/ Touch buttons (multi-touch) -->
<div id="controls">
  <div class="pad" id="padL">
    <button class="cb" data-k="left">◀<small data-i18n="left"></small></button>
    <button class="cb" data-k="right">▶<small data-i18n="right"></small></button>
  </div>
  <div class="pad" id="padR">
    <button class="cb" data-k="sep">⇋<small data-i18n="sep"></small></button>
    <button class="cb" data-k="down">▼<small data-i18n="dig"></small></button>
    <button class="cb" data-k="up">▲<small data-i18n="up"></small></button>
    <button class="cb big" data-k="thrust">🔥<small data-i18n="thrust"></small></button>
  </div>
</div>
<button class="tb hide" id="skip" data-i18n="skip"></button>

<!-- 主菜单 / Main menu -->
<div class="ov" id="ovMenu">
  <div class="panel">
    <h1 data-i18n="title"></h1>
    <div class="sub" id="menuSub"></div>
    <div class="kv"><span data-i18n="credits"></span><span class="gold" id="menuCredits">0</span></div>
    <div class="kv"><span data-i18n="best"></span><span class="gold" id="menuBest">0</span></div>
    <button class="mb" id="btnStart" data-i18n="start"></button>
    <button class="mb alt" id="btnShop" data-i18n="shop"></button>
    <button class="mb alt" id="btnAch" data-i18n="ach"></button>
    <p data-i18n="how"></p>
    <p style="font-size:12px;color:#7f8fbf" data-i18n="keys"></p>
  </div>
</div>
<!-- 升级商店 / Upgrade shop -->
<div class="ov hide" id="ovShop">
  <div class="panel">
    <h2 data-i18n="shop"></h2>
    <div class="kv"><span data-i18n="credits"></span><span class="gold" id="shopCredits">0</span></div>
    <div id="shopList"></div>
    <button class="mb" id="shopStart" data-i18n="start"></button>
    <button class="mb alt" id="shopBack" data-i18n="back"></button>
  </div>
</div>
<!-- 成就 / Achievements -->
<div class="ov hide" id="ovAch">
  <div class="panel">
    <h2 data-i18n="ach"></h2>
    <div id="achList"></div>
    <button class="mb alt" id="achBack" data-i18n="back"></button>
  </div>
</div>
<!-- 结果 / Result -->
<div class="ov hide" id="ovResult">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <div id="resBody"></div>
    <div id="resBtns"></div>
  </div>
</div>
<!-- 暂停 / Pause -->
<div class="ov hide" id="ovPause">
  <div class="panel">
    <h2 data-i18n="paused"></h2>
    <button class="mb" id="btnResume" data-i18n="resume"></button>
    <button class="mb alt" id="btnQuit" data-i18n="menu"></button>
  </div>
</div>

<script>

  },

    transit: 'Trans-lunar transfer…', skip: 'Skip ▶',
    landHint: 'Land softly: descent <3 m/s, drift <2.5 m/s, tilt <15°. Green lights mark the pad', vs: 'V-spd', hs: 'H-spd', ang: 'Tilt',
    landed: 'Touchdown!', landBonus: 'Landing bonus +{0}',
    crash: 'Lander crashed', tooFast: 'Descending too fast', tooSide: 'Drifting too fast', tooTilt: 'Tilted too much', tooSteep: 'Ground too steep',
    retryLand: 'Retry landing', retryLaunch: 'Relaunch', menu: 'Main menu', launchFail: 'Launch failed', launchFailWhy: 'Did not reach transfer altitude',
    mineHint: '◀▶ drive, ▼ dig down, push into a wall to dig sideways, ▲ jet; return to the lander to unload and recharge',
    cargo: 'Cargo', battery: 'Battery', depth: 'Depth', cargoFull: 'Cargo full! Return to the lander', bedrock: 'Bedrock is too hard', lowBat: 'Battery low, head back to the lander!',
    end: 'End', endNeed: 'Get back to the lander to end the mission', batDead: 'Battery dead, cargo lost', runOver: 'Mission complete', runEarned: 'Earned this run',
    landingB: 'Landing bonus', sales: 'Ore sales', sepB: 'Staging bonus', newHigh: '🏆 New high score!', again: 'Play again', paused: 'Paused', resume: 'Resume',
    level: 'Lv', buy: 'Upgrade', maxed: 'Maxed', poor: 'Not enough credits', achUnlock: '🏅 Achievement: {0}', atLander: 'Lander: unloading / charging', sold: '+{0}'
  }
};
// 矿物名称 / Ore names
const ORE_NAMES = {
  zh: ['', '月壤', '玄武岩', '水冰', '铁矿', '钛铁矿', '氦-3', '基岩'],
  en: ['', 'Regolith', 'Basalt', 'Water ice', 'Iron', 'Titanium', 'Helium-3', 'Bedrock']
};
// 升级项名称与说明 / Upgrade names and descriptions
const UPGRADE_TEXT = {
  zh: { drill: ['钻头', '挖得更快'], cargo: ['货舱', '一次装更多矿'], fuel: ['燃料箱', '火箭与着陆器燃料更多'], engine: ['发动机', '火箭、着陆器、推进器推力更大'], battery: ['电池', '挖掘机续航更久'] },

};
// 成就名称与说明 / Achievement names and descriptions
const ACH_TEXT = {
  zh: { liftoff: ['点火升空', '完成第一次发射'], perfectSep: ['完美分离', '燃料耗尽 0.8 秒内完成分离'], landed: ['鹰已着陆', '第一次成功着陆'],
        soft: ['羽毛落地', '以小于 1 m/s 的速度着陆'], pad: ['精准着陆', '降落在着陆场上'], he3: ['未来能源', '挖到氦-3'],
        deep: ['深层勘探', '挖到 30 米深'], rich: ['月球富翁', '单次任务收入达到 1000'], maxed: ['顶级装备', '任意一项升到满级'], veteran: ['老练宇航员', '完成 5 次任务'] },
  en: { liftoff: ['Liftoff', 'Complete your first launch'], perfectSep: ['Clean Staging', 'Stage within 0.8 s of burnout'], landed: ['The Eagle Has Landed', 'First successful landing'],
        soft: ['Feather Touch', 'Land slower than 1 m/s'], pad: ['Bullseye', 'Land on the landing pad'], he3: ['Future Fuel', 'Mine Helium-3'],
        deep: ['Deep Survey', 'Dig 30 m deep'], rich: ['Moon Tycoon', 'Earn 1000 in one mission'], maxed: ['Top Gear', 'Max out any upgrade'], veteran: ['Veteran', 'Finish 5 missions'] }
};
const ACH_ORDER = ['liftoff', 'perfectSep', 'landed', 'soft', 'pad', 'he3', 'deep', 'rich', 'maxed', 'veteran'];

// ===== 存档（localStorage）/ Save data (localStorage) =====
const SAVE_KEY = 'moonMiner.save.v1';
function defaultSave() {
  return { credits: 0, high: 0, lang: 'zh', muted: false,
    up: { drill: 0, cargo: 0, fuel: 0, engine: 0, battery: 0 }, ach: {}, stats: { runs: 0 } };
}
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === 'object') {
      const d = defaultSave();
      return Object.assign(d, s, { up: Object.assign(d.up, s.up), ach: Object.assign({}, s.ach), stats: Object.assign(d.stats, s.stats) });
    }
  } catch (e) { /* 存档损坏则重置 / reset on corrupt save */ }
  return defaultSave();
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 隐私模式可能失败 / may fail in private mode */ } }

// 取当前语言文本，支持 {0} 占位 / Get text in current language with {0} placeholders
function t(key, ...args) {
  let s = (I18N[save.lang] && I18N[save.lang][key]) ?? I18N.zh[key] ?? key;
  args.forEach((a, i) => { s = s.replace('{' + i + '}', a); });
  return s;
}
const $ = id => document.getElementById(id);

// ===== 升级配置 / Upgrade config =====
const UPGRADES = { drill: 120, cargo: 100, fuel: 90, engine: 110, battery: 100 }; // 基础价格 / base cost
const MAX_LVL = 5;
const upCost = k => Math.round(UPGRADES[k] * Math.pow(1.75, save.up[k]));

// ===== 随机数（可设种子）/ Seeded RNG =====
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;

// ===== 画布与高清屏适配 / Canvas & devicePixelRatio =====
const cv = $('game'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, TS = 40; // TS = 采矿格子像素 / mining tile size in CSS px
let tileCache = {};
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  TS = Math.round(clamp(Math.min(W, H) / 10, 30, 60));
  tileCache = {};
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();

// 星空（预生成）/ Pre-generated starfield
const STARS = (() => { const r = mulberry32(42), a = []; for (let i = 0; i < 180; i++) a.push({ x: r(), y: r(), s: r() * 1.4 + 0.3, p: r() * 6.28 }); return a; })();

// ===== 声音（WebAudio 合成）/ Sound (synthesised with WebAudio) =====
const audio = {
  ac: null, engGain: null, noiseBuf: null,
  unlock() {
    if (!this.ac) {
      try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      // 发动机噪声循环 / looping engine noise
      const len = this.ac.sampleRate, buf = this.ac.createBuffer(1, len, this.ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      const src = this.ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;

  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.08, 0, i * 0.11)); },

function addPart(x, y, vx, vy, life, color, size) { if (parts.length < 400) parts.push({ x, y, vx, vy, life, max: life, color, size }); }
function stepParts(dt, gy) { // gy = 重力加速度（世界单位，正值向 +y）/ gravity along +y in world units

// 小挖掘机（原创矢量画）/ The little excavator (original vector art). size = 宽度像素 / width in px; (x,y) = 履带底部中心 / bottom centre
function drawDigger(x, y, size, face = 1, armAng = 0, digging = false, dead = false) {

/* =====================================================================
 * 阶段一：发射 / Phase 1: Launch
 * ===================================================================== */
const LAUNCH_TARGET = 1200;   // 目标高度（m，显示为 /10 km）/ target altitude (m, shown as /10 km)
const ROCKET_LEN = 40;         // 火箭长度（m）/ rocket length (m)
function startMission() {
  audio.unlock(); paused = false;
  run = { landing: 0, sales: 0, sep: 0 };
  startLaunch();
}
function startLaunch() {
  const u = save.up;
  L = { h: 0, v: 0, stage: 1, f1: 100 + u.fuel * 15, f1max: 100 + u.fuel * 15, f2: 60 + u.fuel * 10, f2max: 60 + u.fuel * 10,
        needSep: false, sepT: 0, booster: null, thr: false, lifted: false, peak: 0, end: 0, failed: false, shake: 0 };
  run.sep = 0;
  setPhase('launch');
}
function separate(perfect) {
  L.needSep = false; L.stage = 2;
  L.booster = { y: L.h, v: L.v, rot: 0 };
  audio.boom(0.2, 0.4); L.shake = 0.4;
  if (perfect) { run.sep = 50; save.credits += 50; persist(); toast(t('perfectSep', 50)); unlockAch('perfectSep'); }
  else toast(t('autoSep'));
  for (let i = 0; i < 30; i++) addPart((Math.random() - 0.5) * 6, L.h + ROCKET_LEN * 0.55, (Math.random() - 0.5) * 30, L.v + (Math.random() - 0.5) * 20, 0.8, '#fff', 0.25);
}
function updateLaunch(dt) {
  const u = save.up, g = 9.8, want = input.thrust || input.up;
  let acc = 0; L.thr = false;
  if (L.failed) { L.end += dt; if (L.h > 0) { L.v -= g * dt; L.h = Math.max(0, L.h + L.v * dt); } stepParts(dt, -2); audio.engine(0); if (L.end > 1.6) launchFailed(); return; }
  if (L.stage === 1 && !L.needSep) {
    if (want && L.f1 > 0) { L.thr = true; L.f1 = Math.max(0, L.f1 - 20 * dt); acc = 28 + u.engine * 2.5; }
    if (L.f1 <= 0) { L.needSep = true; L.sepT = 0; toast(t('sepNow')); audio.tone(440, 0.15, 'square', 0.05); }
  } else if (L.needSep) {
    L.sepT += dt;
    if (taps.has('sep') || taps.has('down')) separate(L.sepT < 0.8);
    else if (L.sepT > 2) separate(false);
  } else if (L.stage === 2 && want && L.f2 > 0) { L.thr = true; L.f2 = Math.max(0, L.f2 - 15 * dt); acc = 22 + u.engine * 2; }
  if (!L.lifted && acc <= g) { L.v = 0; } else {
    L.v += (acc - g) * dt; L.h += L.v * dt;
    if (L.h > 1) L.lifted = true;
    if (L.h > 30) unlockAch('liftoff');
  }
  if (L.h <= 0 && L.lifted) { // 坠回地面 / fell back to the ground
    L.h = 0; L.failed = true; L.end = 0; audio.boom();
    for (let i = 0; i < 60; i++) addPart((Math.random() - .5) * 10, Math.random() * 10, (Math.random() - .5) * 60, Math.random() * 40, 1.2, i % 2 ? '#ff9a3c' : '#ffd166', 0.5);
    return;
  }
  if (L.h < 0) L.h = 0;
  L.peak = Math.max(L.peak, L.h);
  // 燃料耗尽且开始下坠且未到目标 → 失败 / out of fuel, falling, below target → fail
  if (L.stage === 2 && L.f2 <= 0 && L.v < 0 && L.h < LAUNCH_TARGET) { L.failed = true; L.end = 0; }
  if (L.h >= LAUNCH_TARGET) { audio.engine(0); audio.win(); startTransit(); return; }
  if (L.booster) { L.booster.v -= g * dt; L.booster.y += L.booster.v * dt; L.booster.rot += dt * 0.8; }
  L.shake = Math.max(0, L.shake - dt);
  // 尾焰与发射烟雾 / exhaust and launch smoke
  if (L.thr) for (let i = 0; i < 3; i++) addPart((Math.random() - 0.5) * 3, L.h - 1, (Math.random() - 0.5) * 12, L.v - 25 - Math.random() * 25, 0.5 + Math.random() * 0.4, Math.random() < 0.5 ? '#ffb347' : '#ff6a2b', 0.35 + Math.random() * 0.25);
  if (L.h < 40 && L.thr) for (let i = 0; i < 2; i++) addPart((Math.random() - 0.5) * 30, 0.5, (Math.random() - 0.5) * 40, 3 + Math.random() * 5, 1.2, 'rgba(220,220,230,.8)', 0.8);
  stepParts(dt, -2);
  audio.engine(L.thr ? 1 : 0);
}
function launchFailed() {
  audio.engine(0); setPhase('over');
  showResult(t('launchFail'), [[t('launchFailWhy'), ''], [t('alt'), (L.peak / 10).toFixed(1) + ' km']],
    [[t('retryLaunch'), () => startLaunch()], [t('shop'), () => showOverlay('ovShop'), true], [t('menu'), goMenu, true]]);
}
function drawRocket(cx, by, ppm, part) { // part: 'full' 整箭 | 'upper' 二级 | 'booster' 一级 / full stack | upper stage | booster
  const w = 5 * ppm, s1 = 22 * ppm, s2 = 12 * ppm, nose = 6 * ppm;
  ctx.save(); ctx.translate(cx, by);
  if (part !== 'upper') { // 一级 / stage 1
    ctx.fillStyle = '#e9edf5'; ctx.fillRect(-w / 2, -s1, w, s1);
    ctx.fillStyle = '#c7cfdc'; ctx.fillRect(w * 0.15, -s1, w * 0.35, s1);
    ctx.fillStyle = '#2d3a5a'; ctx.fillRect(-w / 2, -s1 * 0.55, w, s1 * 0.07);
    ctx.fillStyle = '#d33'; ctx.fillRect(-w / 2, -s1 * 0.25, w, s1 * 0.05);
    ctx.fillStyle = '#4a4f5c'; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w * 0.95, ppm * 2); ctx.lineTo(-w * 0.95, -ppm * 3); ctx.lineTo(-w / 2, -ppm * 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w * 0.95, ppm * 2); ctx.lineTo(w * 0.95, -ppm * 3); ctx.lineTo(w / 2, -ppm * 6); ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(-w * 0.3, 0, w * 0.6, ppm * 1.2);
  }
  if (part !== 'booster') { // 二级与整流罩 / stage 2 and fairing
    const base = part === 'upper' ? 0 : -s1;
    ctx.fillStyle = '#f4f6fb'; ctx.fillRect(-w / 2, base - s2, w, s2);
    ctx.fillStyle = '#d0d7e3'; ctx.fillRect(w * 0.15, base - s2, w * 0.35, s2);

  else if (dx < 0) { const c = Math.floor(M.x - HW); for (let y = r0; y <= r1; y++) if (solid(c, y)) { M.x = c + 1 + HW + 0.0001; M.vx = 0; return true; } }
  return false;
}
function moveY(dy) {
  M.y += dy; const c0 = Math.floor(M.x - HW + 0.02), c1 = Math.floor(M.x + HW - 0.02);
  if (dy > 0) { const y = Math.floor(M.y); for (let c = c0; c <= c1; c++) if (solid(c, y)) { M.y = y; M.vy = 0; return 1; } }
  else if (dy < 0) { const y = Math.floor(M.y - HH); for (let c = c0; c <= c1; c++) if (solid(c, y)) { M.y = y + 1 + HH; M.vy = 0; return -1; } }
  return 0;
}
function onGround() {
  if (M.y - Math.floor(M.y) > 0.02) return false;
  const y = Math.floor(M.y + 0.01), c0 = Math.floor(M.x - HW + 0.02), c1 = Math.floor(M.x + HW - 0.02);
  for (let c = c0; c <= c1; c++) if (solid(c, y)) return true;
  return false;
}
const atLander = () => !!M && Math.abs(M.x - (LANDER_C + 0.5)) < 1.7 && M.y <= M.surf[LANDER_C] + 0.05;
function tryDig(c, y, dir) {
  const tp = tileAt(c, y);
  if (tp === EMPTY) return false;
  if (tp === BED) { toastOnce('bed', t('bedrock')); return false; }
  if (TILE[tp].val > 0 && M.cargo.length >= M.cap) { toastOnce('full', t('cargoFull')); return false; }
  M.dig = { c, y, dir, prog: 0, need: 0.32 * TILE[tp].hard / (1 + 0.4 * save.up.drill) };
  return true;
}
function finishDig() {
  const { c, y } = M.dig, tp = tileAt(c, y); M.grid[y * COLS + c] = EMPTY; M.dig = null;
  for (let i = 0; i < 10; i++) addPart(c + 0.5 + (Math.random() - .5) * .8, y + 0.5 + (Math.random() - .5) * .8, (Math.random() - .5) * 4, -Math.random() * 3, 0.6, TILE[tp].gem || TILE[tp].dot, 0.08);
  if (TILE[tp].val > 0) {
    M.cargo.push(tp); audio.tone(520 + tp * 90, 0.09, 'triangle', 0.06);
    floats.push({ x: c + 0.5, y: y, text: ORE_NAMES[save.lang][tp], t: 1.2, color: TILE[tp].gem });
    if (tp === HE3) unlockAch('he3');
  } else audio.tone(140, 0.06, 'sawtooth', 0.04);
}
function updateMining(dt) {
  const u = save.up, G = 9; // 采矿重力（格/s²）/ mining gravity (tiles/s²)
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t -= dt; floats[i].y -= dt * 0.8; if (floats[i].t <= 0) floats.splice(i, 1); }
  stepParts(dt, 6);
  if (M.dead) { M.deadT += dt; audio.engine(0); if (M.deadT > 1.6) endRun(true); return; }
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const grounded = onGround();
  let drain = 0.25;
  if (M.dig) {
    // 持续按住才继续挖 / keep digging only while the key is held
    const held = M.dig.dir === 'down' ? input.down : (M.dig.dir === 1 ? input.right : input.left);
    if (!held) M.dig = null;
    else {
      M.dig.prog += dt; drain += 1.6;
      if (M.dig.dir === 'down') M.x += (M.dig.c + 0.5 - M.x) * Math.min(1, dt * 12);
      if (Math.random() < dt * 14) { audio.dig(); addPart(M.dig.c + 0.5 + (Math.random() - .5) * .6, M.dig.y + (M.dig.dir === 'down' ? 0.05 : 0.5), (Math.random() - .5) * 3, -1 - Math.random() * 2, 0.4, TILE[tileAt(M.dig.c, M.dig.y)].dot, 0.06); }
      if (M.dig.prog >= M.dig.need) finishDig();
    }
  }
  M.jet = false;
  if (!M.dig) {
    if (dir) { M.face = dir; M.vx = dir * (grounded ? 3.4 : 2.4); drain += 0.6; } else M.vx = grounded ? 0 : M.vx * (1 - dt * 2);
    // 推进器 / jet thruster
    M.jet = (input.up || input.thrust) && M.bat > 0;
    if (M.jet) {
      M.vy -= (17 + u.engine * 1.6) * dt; M.vy = Math.max(M.vy, -5); drain += 2.4;
      addPart(M.x - M.face * 0.25, M.y - 0.05, (Math.random() - .5) * 1.5, 3 + Math.random() * 2, 0.3, Math.random() < .5 ? '#9be7ff' : '#ffffff', 0.07);
    }
    if (grounded && input.down) tryDig(Math.floor(M.x), Math.floor(M.y), 'down');
    else if (grounded && dir) {
      const c = Math.floor(M.x + dir * (HW + 0.06)), y = Math.floor(M.y - 0.35), cMe = Math.floor(M.x);
      if (solid(c, y)) {
        if (!solid(c, y - 1) && !solid(cMe, y - 1)) M.vy = -Math.sqrt(2 * G * 1.25); // 自动爬上一格台阶 / auto step-up one tile
        else tryDig(c, y, dir);
      }
    }
  }
  if (!(M.dig && M.dig.dir === 'down')) M.vy = Math.min(M.vy + G * dt, 11);
  moveX(M.vx * dt); moveY(M.vy * dt);
  if (M.y - HH < -6) { M.y = -6 + HH; M.vy = Math.max(0, M.vy); } // 天空上限 / sky ceiling
  // 电量 / battery
  M.bat = Math.max(0, M.bat - drain * dt);
  if (M.bat < M.batMax * 0.2 && !M.lowWarned) { M.lowWarned = true; toast(t('lowBat')); audio.tone(300, 0.2, 'square', 0.06); }
  if (M.bat <= 0 && !atLander()) { M.dead = true; M.deadT = 0; M.dig = null; toast(t('batDead')); audio.boom(0.15, 0.5); }
  // 着陆器：卸货与充电 / lander: unload & recharge
  if (atLander()) {
    M.bat = Math.min(M.batMax, M.bat + 45 * dt); if (M.bat > M.batMax * 0.3) M.lowWarned = false;
    M.sellT -= dt;
    if (M.cargo.length && M.sellT <= 0) {
      const tp = M.cargo.shift(), v = TILE[tp].val; M.sellT = 0.14;
      run.sales += v; save.credits += v; persist(); audio.coin();
      floats.push({ x: LANDER_C + 0.5, y: M.surf[LANDER_C] - 3, text: t('sold', v), t: 1, color: '#ffd166' });
      if (run.landing + run.sales + run.sep >= 1000) unlockAch('rich');
    }
  }
  const depth = Math.floor(M.y) - M.surf[LANDER_C];
  if (depth > M.maxDepth) { M.maxDepth = depth; if (depth >= 30) unlockAch('deep'); }
  audio.engine(M.jet ? 0.35 : (M.dig ? 0.15 : 0));
}
// 预渲染格子贴图（按 DPR 缓存）/ pre-render tile sprites (cached per DPR)
function tileSprite(tp, variant) {
  const key = tp + '_' + variant; if (tileCache[key]) return tileCache[key];
  const px = Math.ceil(TS * DPR), c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d'), r = mulberry32(tp * 977 + variant * 131 + 7), info = TILE[tp];
  g.fillStyle = info.base; g.fillRect(0, 0, px, px);
  g.fillStyle = info.dot; for (let i = 0; i < 9; i++) { const s = px * (0.05 + r() * 0.09); g.beginPath(); g.arc(r() * px, r() * px, s, 0, 6.283); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, px * 0.92, px, px * 0.08); g.fillRect(px * 0.92, 0, px * 0.08, px);
  g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(0, 0, px, px * 0.06);
  if (info.gem) { // 矿物晶体 / ore crystals
    const n = tp === HE3 ? 3 : 4;
    for (let i = 0; i < n; i++) {
      const cx = px * (0.2 + r() * 0.6), cy = px * (0.2 + r() * 0.6), s = px * (0.1 + r() * 0.08);
      g.fillStyle = info.gem; g.beginPath(); g.moveTo(cx, cy - s); g.lineTo(cx + s * 0.8, cy); g.lineTo(cx, cy + s); g.lineTo(cx - s * 0.8, cy); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(cx, cy - s); g.lineTo(cx + s * 0.3, cy - s * 0.2); g.lineTo(cx - s * 0.2, cy - s * 0.1); g.fill();
    }
    if (tp === HE3) { g.strokeStyle = 'rgba(255,240,150,.5)'; g.lineWidth = px * 0.04; g.strokeRect(px * 0.06, px * 0.06, px * 0.88, px * 0.88); }
  }
  if (tp === BED) { g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = px * 0.05; g.beginPath(); g.moveTo(0, px * 0.3); g.lineTo(px * 0.5, px * 0.6); g.lineTo(px, px * 0.4); g.stroke(); }

}
function renderMining() {
  const sy0 = M.surf[LANDER_C];
  let camX = M.x * TS - W / 2, camY = (M.y - 0.5) * TS - H * 0.45;
  camX = COLS * TS <= W ? (COLS * TS - W) / 2 : clamp(camX, 0, COLS * TS - W);
  camY = clamp(camY, -6 * TS, ROWS * TS - H + TS * 3);
  const toScr = (x, y) => [x * TS - camX, y * TS - camY];
  // 天空 / sky
  ctx.fillStyle = '#03040b'; ctx.fillRect(0, 0, W, H);
  drawStars(1, -camX * 0.2);
  const skyBottom = (sy0 - 3) * TS - camY;
  if (skyBottom > -TS * 4) drawEarth(W * 0.72, Math.max(130, skyBottom - TS * 2.5), Math.min(W, H) * 0.07); // 避开顶部按钮 / keep clear of the top buttons
  // 地面格子 / ground tiles
  const c0 = Math.max(0, Math.floor(camX / TS)), c1 = Math.min(COLS - 1, Math.ceil((camX + W) / TS));
  const r0 = Math.max(0, Math.floor(camY / TS)), r1 = Math.min(ROWS - 1, Math.ceil((camY + H) / TS));
  for (let c = c0; c <= c1; c++) {
    const sTop = M.surf[c];
    for (let y = Math.max(r0, sTop); y <= r1; y++) {
      const tp = M.grid[y * COLS + c], [sx, sy] = toScr(c, y);
      if (tp === EMPTY) { ctx.fillStyle = '#1d1b1a'; ctx.fillRect(sx, sy, TS + 0.5, TS + 0.5); continue; }
      ctx.drawImage(tileSprite(tp, (c * 7 + y * 13) % 3), sx, sy, TS + 0.5, TS + 0.5);
      if (tileAt(c, y - 1) === EMPTY) { ctx.fillStyle = y === sTop ? 'rgba(225,222,214,.55)' : 'rgba(220,218,210,.2)'; ctx.fillRect(sx, sy, TS + 0.5, Math.max(2, TS * 0.08)); }
    }
  }
  // 挖掘进度裂纹 / dig progress cracks
  if (M.dig) {
    const [sx, sy] = toScr(M.dig.c, M.dig.y), p = clamp(M.dig.prog / M.dig.need, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 2; ctx.beginPath();
    const n = Math.ceil(p * 5); for (let i = 0; i < n; i++) { const a = i * 1.3; ctx.moveTo(sx + TS / 2, sy + TS / 2); ctx.lineTo(sx + TS / 2 + Math.cos(a) * TS * 0.45 * p, sy + TS / 2 + Math.sin(a) * TS * 0.45 * p); }
    ctx.stroke();

  // 着陆器 / the lander

  if (atLander()) { // 卸货区高亮 / unloading zone glow
    ctx.strokeStyle = `rgba(92,255,138,${0.55 + 0.35 * Math.sin(clock * 6)})`; ctx.lineWidth = 3;

  }
  drawLander(lx, ly - TS * 0.84, TS * 0.2, 0, false); // 脚在地面 / feet on the ground
  // 挖掘机 / excavator

  let arm = -0.15; if (M.dig) arm = M.dig.dir === 'down' ? 1.25 + Math.sin(clock * 30) * 0.06 : 0.2 + Math.sin(clock * 30) * 0.06;
  if (M.jet) { ctx.fillStyle = 'rgba(155,231,255,.75)'; ctx.beginPath(); ctx.moveTo(mx - TS * 0.15, my - TS * 0.05); ctx.lineTo(mx, my + TS * (0.3 + Math.random() * 0.2)); ctx.lineTo(mx + TS * 0.15, my - TS * 0.05); ctx.fill(); }
  drawDigger(mx, my, TS * 0.95, M.face, arm, !!M.dig, M.dead);
  drawParts(toScr, TS);
  // 深度变暗 + 车灯光圈 / darkness by depth + headlight
  const dark = clamp((M.y - sy0) / 40, 0, 0.82);
  if (dark > 0.02) {
    const gr = ctx.createRadialGradient(mx, my - TS * 0.4, TS * 1.2, mx, my - TS * 0.4, TS * 5.5);

  for (const f of floats) { const [fx, fy] = toScr(f.x, f.y); ctx.globalAlpha = clamp(f.t, 0, 1); ctx.fillStyle = '#000'; ctx.fillText(f.text, fx + 1, fy + 1); ctx.fillStyle = f.color || '#fff'; ctx.fillText(f.text, fx, fy); }

}
function endRun(dead) {
  if (!dead) { // 结束时卖掉剩余货物 / sell remaining cargo on exit
    for (const tp of M.cargo) { run.sales += TILE[tp].val; save.credits += TILE[tp].val; }
    M.cargo = [];
  }
  const total = run.landing + run.sales + run.sep;
  const isHigh = total > save.high; if (isHigh) save.high = total;
  save.stats.runs++; if (save.stats.runs >= 5) unlockAch('veteran');
  if (total >= 1000) unlockAch('rich');
  persist(); audio.engine(0); setPhase('over');
  const rows = [[t('sepB'), '+' + run.sep], [t('landingB'), '+' + run.landing], [t('sales'), '+' + run.sales], [t('runEarned'), String(total), 'gold'], [t('best'), String(save.high)], [t('credits'), String(save.credits), 'gold']];
  if (dead) rows.unshift([t('batDead'), '']);
  if (isHigh && total > 0) rows.unshift([t('newHigh'), '', 'gold']);
  showResult(t('runOver'), rows, [[t('shop'), () => showOverlay('ovShop')], [t('again'), startMission, true], [t('menu'), goMenu, true]]);
  if (!dead) audio.win();
}

/* =====================================================================
 * 主菜单背景动画 / Main-menu background animation
 * ===================================================================== */
function renderMenuBg() {
  ctx.fillStyle = '#03040b'; ctx.fillRect(0, 0, W, H); drawStars(1, clock * 6);
  const m = Math.min(W, H), R = Math.max(W, H) * 0.55, my = H + R * 0.55;
  drawEarth(W * 0.2, H * 0.14, m * 0.1);
  drawMoon(W / 2, my, R);
  const a = Math.sin(clock * 0.4) * 0.5; // 挖掘机沿月面来回开 / the excavator drives along the lunar surface
  ctx.save(); ctx.translate(W / 2, my); ctx.rotate(a); drawDigger(0, -R + 2, m * 0.14, Math.cos(clock * 0.4) > 0 ? 1 : -1, -0.1); ctx.restore();
}

// ===== HUD 文本 / HUD text =====
let hudT = 0, hudLast = '';
function bar(p, color) { return `<span class="bar"><i style="width:${(clamp(p, 0, 1) * 100).toFixed(0)}%;background:${color}"></i></span>`; }
function updateHUD(force) {
  let s = '';
  if (phase === 'launch' && L) {
    const f = L.stage === 1 ? L.f1 / L.f1max : L.f2 / L.f2max;
    s = `${t('alt')} ${(L.h / 10).toFixed(1)} / ${LAUNCH_TARGET / 10} km<br>${t('spd')} ${(L.v * 36).toFixed(0)} km/h<br>${t('stage')} ${L.stage} · ${t('fuel')} ${bar(f, f < 0.2 ? '#ff7b7b' : '#7dff9a')}<br>💰 ${save.credits}`;
  } else if (phase === 'landing' && LD) {
    const alt = Math.max(0, LD.y - 4 * Math.cos(LD.a) - groundAt(LD.x));
    const okV = LD.vy > -3.2, okH = Math.abs(LD.vx) <= 2.5, okA = Math.abs(LD.a) <= 0.26;
    s = `${t('alt')} ${alt.toFixed(0)} m<br>${t('vs')} <span class="${okV ? 'ok' : 'bad'}">${LD.vy.toFixed(1)} m/s</span><br>${t('hs')} <span class="${okH ? 'ok' : 'bad'}">${LD.vx.toFixed(1)} m/s</span><br>${t('ang')} <span class="${okA ? 'ok' : 'bad'}">${(LD.a * 57.3).toFixed(0)}°</span><br>${t('fuel')} ${bar(LD.fuel / LD.fuelMax, LD.fuel < 20 ? '#ff7b7b' : '#7dff9a')}`;
  } else if (phase === 'mining' && M) {
    const bp = M.bat / M.batMax, depth = Math.max(0, Math.floor(M.y) - M.surf[LANDER_C]);
    s = `${t('battery')} ${bar(bp, bp < 0.2 ? '#ff7b7b' : bp < 0.45 ? '#ffd166' : '#7dff9a')} ${(bp * 100).toFixed(0)}%<br>${t('cargo')} <span class="${M.cargo.length >= M.cap ? 'warn' : ''}">${M.cargo.length}/${M.cap}</span> · ${t('depth')} ${depth} m<br>💰 ${save.credits}${atLander() ? '<br><span class="ok">' + t('atLander') + '</span>' : ''}`;
  }
  if (force || s !== hudLast) { $('stats').innerHTML = s; hudLast = s; }
  // 分离按钮：只在一级时显示，燃料耗尽时闪烁 / staging button: shown during stage 1, flashing at burnout
  const sepBtn = document.querySelector('.cb[data-k="sep"]');
  sepBtn.classList.toggle('flash', phase === 'launch' && !!L && L.needSep);
  sepBtn.classList.toggle('hide', !(phase === 'launch' && L && L.stage === 1));
}

// ===== 暂停 / 静音 / 语言 / Pause, mute, language =====
function togglePause(force) {
  if (!CONTROL_SETS[phase] && phase !== 'transit') return;
  paused = force !== undefined ? force : !paused;
  clearInput(); audio.engine(0);
  showOverlay(paused ? 'ovPause' : null);
}
function toggleMute() { save.muted = !save.muted; persist(); $('btnMute').textContent = save.muted ? '🔇' : '🔊'; audio.unlock(); audio.engine(0); }
$('btnPause').onclick = () => togglePause();
$('btnResume').onclick = () => togglePause(false);
$('btnQuit').onclick = () => { paused = false; goMenu(); };
$('btnMute').onclick = toggleMute;
$('btnLang').onclick = () => { save.lang = save.lang === 'zh' ? 'en' : 'zh'; persist(); applyLang(); updateHUD(true); };
$('btnStart').onclick = () => { audio.unlock(); audio.click(); startMission(); };
$('btnShop').onclick = () => { audio.unlock(); audio.click(); showOverlay('ovShop'); };
$('btnAch').onclick = () => { audio.unlock(); audio.click(); showOverlay('ovAch'); };
$('shopBack').onclick = () => { audio.click(); goMenu(); };
$('shopStart').onclick = () => { audio.unlock(); audio.click(); startMission(); };
$('achBack').onclick = () => { audio.click(); goMenu(); };
$('skip').onclick = () => { if (phase === 'transit') startLanding(); };
$('btnEnd').onclick = () => { if (phase !== 'mining' || M.dead) return; if (!atLander()) { toast(t('endNeed')); return; } endRun(false); };
// 切到后台自动暂停 / auto-pause when the tab is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (CONTROL_SETS[phase] || phase === 'transit') togglePause(true); audio.engine(0); } });
window.addEventListener('blur', () => clearInput());

// ===== 主循环 / Main loop =====
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    clock += dt;
    if (phase === 'launch') updateLaunch(dt);
    else if (phase === 'transit') updateTransit(dt);
    else if (phase === 'landing') updateLanding(dt);
    else if (phase === 'mining') updateMining(dt);
  }
  taps.clear();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'launch' && L) renderLaunch();
  else if (scene === 'transit' && TR) renderTransit();
  else if (scene === 'landing' && LD) renderLanding();
  else if (scene === 'mining' && M) renderMining();

  if (hintT > 0 && !paused) { hintT -= dt; if (hintT <= 0) $('hint').textContent = ''; }
  hudT += dt; if (hudT > 0.1) { hudT = 0; updateHUD(); }
  requestAnimationFrame(frame);
}

// ===== 启动 / Boot =====
$('btnMute').textContent = save.muted ? '🔇' : '🔊';
applyLang(); setPhase('menu'); showOverlay('ovMenu');
requestAnimationFrame(frame);
// 离线支持（PWA）/ Offline support (PWA)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* 忽略 / ignore */ }));
}
// 测试钩子（读取状态 + 输入）/ Test hook (read state + input)
window.MoonMiner = { get phase() { return phase; }, get L() { return L; }, get LD() { return LD; }, get M() { return M; }, input, taps, get save() { return save; }, DIGGER_NAME, GAME_NAME };
</script>
