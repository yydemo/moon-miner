<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 移动端视口：禁止缩放，适配刘海屏 / Mobile viewport: no zoom, notch-safe -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="月球挖矿 Moon Miner — 按「星链赚大矿」设定：胶囊飞船登月、扫地机式着陆器扫矿、尘盒分格拍照、游戏内模拟 NFT 市场 / Capsule to the Moon, vacuum-style lander, compartment photos, simulated NFT market (Star-chain Earn-Mine setting).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moon Miner">
<title>月球挖矿 Moon Miner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== 基础样式 / Base styles ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#eef3ff}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* ===== 顶部 HUD / Top HUD ===== */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);z-index:5}
#stats{font-size:12px;line-height:1.45;background:rgba(0,0,0,.45);padding:6px 9px;border-radius:9px;font-variant-numeric:tabular-nums;max-width:68vw}
#stats:empty{display:none}
#stats .ok{color:#7dff9a}#stats .bad{color:#ff7b7b}#stats .warn{color:#ffd166}
.bar{display:inline-block;width:54px;height:7px;border-radius:4px;background:#ffffff22;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:#7dff9a}
#topbtns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.tb{min-width:40px;height:40px;padding:0 10px;border-radius:11px;border:1px solid #ffffff33;background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:600}
.tb:active,.tb.down{background:#ffffff33}
.tb.on{background:rgba(92,255,138,.28);border-color:#7dff9a}
/* ===== 飞行控件 / Flight controls ===== */
#flightUI,#mineUI{position:fixed;inset:0;pointer-events:none;z-index:4}
.cb{pointer-events:auto;touch-action:none;width:clamp(56px,16vmin,84px);height:clamp(56px,16vmin,84px);border-radius:50%;
  border:2px solid #ffffff55;background:rgba(255,255,255,.13);color:#fff;font-weight:700;font-size:clamp(17px,4.6vmin,24px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.cb small{font-size:clamp(10px,2.6vmin,12px);font-weight:500;opacity:.9}
.cb.down{background:rgba(255,190,70,.5);border-color:#ffd166}
.cb.big{width:clamp(74px,22vmin,108px);height:clamp(74px,22vmin,108px)}
.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;align-items:flex-end}
.padL{left:calc(env(safe-area-inset-left) + 12px)}
.padR{right:calc(env(safe-area-inset-right) + 12px)}
#stageWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px)}
#thrBox{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#thr{width:46px;height:clamp(120px,24vh,190px);border-radius:12px;border:2px solid #ffffff55;background:rgba(0,0,0,.35);position:relative;overflow:hidden;touch-action:none}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff8a3c,#ffd166);height:0}
#thr span{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.mini{pointer-events:auto;min-width:44px;height:36px;padding:0 8px;border-radius:10px;border:1px solid #ffffff44;background:rgba(0,0,0,.5);color:#fff;font-size:13px;font-weight:700;touch-action:manipulation}
.mini.on{background:rgba(92,255,138,.3);border-color:#7dff9a}
.mini.down{background:#ffffff33}
#fRow{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + clamp(150px,30vh,235px));display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 8px}
#mapBtns{position:absolute;right:calc(env(safe-area-inset-right) + 10px);top:42%;display:flex;flex-direction:column;gap:6px}
#warpLbl{display:inline-block;min-width:54px;text-align:center;font-size:13px;font-weight:700;line-height:36px;pointer-events:none;background:rgba(0,0,0,.4);border-radius:8px}
#btnDeploy{position:absolute;left:50%;top:21%;transform:translateX(-50%);pointer-events:auto;padding:16px 26px;font-size:19px;border-radius:14px;border:none;font-weight:800;color:#0b1020;background:linear-gradient(180deg,#9dffb8,#3fd17a);box-shadow:0 6px 24px #0008;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}
#mineUI .mrow{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + clamp(96px,26vmin,130px));display:flex;gap:8px}
/* ===== 弹层菜单 / Overlay screens ===== */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(3,5,16,.62);
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.panel{width:100%;max-width:460px;max-height:100%;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:rgba(14,22,48,.94);border:1px solid #5aa9ff55;border-radius:18px;padding:18px 18px 14px;box-shadow:0 10px 40px #0008;text-align:center}
.panel h1{margin:2px 0 4px;font-size:clamp(28px,8vmin,40px);letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#9ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{margin:4px 0 10px;font-size:21px}
.panel h3{margin:14px 0 4px;font-size:16px;color:#9ee7ff;text-align:left}
.panel p{margin:6px 0;font-size:13.5px;line-height:1.55;color:#c9d6ff;text-align:left}
.panel a{color:#9ee7ff}
.sub{color:#9fb3e6;font-size:14px;margin-bottom:10px}
.mb{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:none;font-size:17px;font-weight:700;color:#0b1020;background:linear-gradient(180deg,#ffe08a,#ffb547)}
.mb.alt{background:#24345f;color:#e6eeff;border:1px solid #5aa9ff55}
.mb:disabled{opacity:.45}
.mb:active{transform:scale(.98)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #ffffff14;text-align:left;font-size:14px}
.row b{font-size:14.5px}.row small{color:#9fb3e6}
.row button{flex:none;padding:9px 11px;border-radius:10px;border:none;background:#ffcf5c;color:#0b1020;font-weight:700;font-size:13px}
.row button:disabled{background:#3a4566;color:#8b97b8}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 2px;text-align:left}
.gold{color:#ffd166;font-weight:700}
.ach.lock{opacity:.5}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:92%}
.toast{background:rgba(10,16,40,.9);border:1px solid #ffd16688;color:#fff;padding:7px 13px;border-radius:20px;font-size:13.5px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + clamp(150px,36vmin,190px));z-index:3;pointer-events:none;
  font-size:12.5px;color:#dfe8ff;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:10px;max-width:90%;text-align:center}
#hint:empty{display:none}
/* ===== 机库 / Hangar ===== */
#hangar{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;background:#0a1124;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
.hbar{display:flex;align-items:center;gap:8px;padding:2px 2px 6px}
.hbar b{font-size:18px;flex:1}
.hmain{flex:1;position:relative;min-height:0;border-radius:12px;overflow:hidden;border:1px solid #5aa9ff33}
#hcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hstats{position:absolute;right:6px;top:6px;width:min(56%,300px);max-height:calc(100% - 12px);overflow:auto;background:rgba(6,10,26,.78);border:1px solid #5aa9ff33;border-radius:10px;padding:6px 8px;font-size:12px;touch-action:pan-y}
#hstats .kv{font-size:12.5px;padding:1px 0}
.stg{font-size:11.5px;color:#c9d6ff;padding:2px 0;text-align:left}
.stg.bad,.bad{color:#ff8a8a}
#hsel{position:absolute;left:6px;bottom:6px;display:flex;gap:6px;align-items:center;background:rgba(6,10,26,.85);padding:5px;border-radius:10px;border:1px solid #ffd16666}
#hsel span{font-size:12px;max-width:110px;color:#ffd166}
#palette{display:flex;gap:6px;overflow-x:auto;padding:6px 0;touch-action:pan-x;-webkit-overflow-scrolling:touch;flex:none}
.pcard{flex:none;width:96px;padding:4px 4px 6px;border-radius:10px;border:1px solid #5aa9ff44;background:#152044;color:#e6eeff;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:pan-x}
.pcard b{font-size:11.5px;line-height:1.2}
.pcard small{font-size:10px;color:#9fb3e6;line-height:1.2}
.pcard.locked{opacity:.55}
.hfoot{display:flex;gap:8px;flex:none}
.hfoot .mb{margin:4px 0;padding:11px 6px;font-size:15px}
</style>
</head>
<body>
<canvas id="game" aria-label="Moon Miner game canvas"></canvas>

<!-- 顶部状态与按钮 / Top status and buttons -->
<div id="hud">
  <div id="stats"></div>
  <div id="topbtns">
    <button class="tb hide" id="btnPause" aria-label="pause">⏸</button>
    <button class="tb" id="btnMute" aria-label="mute">🔊</button>
    <button class="tb" id="btnLang" aria-label="language"></button>
  </div>
</div>
<div id="toasts"></div>
<div id="hint"></div>

<!-- 飞行控件 / Flight controls -->
<div id="flightUI" class="hide">
  <div id="fRow">
    <button class="mini" id="btnSAS" data-k="sas">🧭 <span id="sasLbl"></span></button>
    <button class="mini" id="btnAuto">🤖 <span data-i18n="auto"></span></button>
    <button class="mini" data-k="warpDown">⏪</button><span id="warpLbl">×1</span><button class="mini" data-k="warpUp">⏩</button>
    <button class="mini" id="btnMap" data-k="map">🗺 <span data-i18n="map"></span></button>
  </div>
  <div id="mapBtns" class="hide">
    <button class="mini" id="btnZoomIn">＋</button><button class="mini" id="btnZoomOut">－</button><button class="mini" id="btnFocus" data-i18n="focus"></button>
  </div>
  <div class="pad padL">
    <button class="cb" data-k="left">⟲<small data-i18n="rotL"></small></button>
    <button class="cb" data-k="right">⟳<small data-i18n="rotR"></small></button>
  </div>
  <div id="stageWrap"><button class="cb big" data-k="stage">🚀<small id="btnStageLbl"></small></button></div>
  <div class="pad padR">
    <div id="thrBox">
      <button class="mini" data-k="full" data-i18n="full"></button>
      <div id="thr"><div id="thrFill"></div><span data-i18n="thr"></span></div>
      <button class="mini" data-k="cut" data-i18n="cut"></button>
    </div>
  </div>
  <button id="btnDeploy" class="hide" data-i18n="deploy"></button>
</div>

<!-- 采矿控件 / Mining controls -->
<div id="mineUI" class="hide">
  <div class="mrow"><button class="mini" id="btnMint">⛓ <span data-i18n="emptyBox"></span></button><button class="mini" id="btnMarket" data-i18n="market"></button><button class="mini" id="btnEnd" data-i18n="end"></button></div>
  <div class="pad padL">
    <button class="cb" data-k="left">◀</button>
    <button class="cb" data-k="right">▶</button>
  </div>
  <div class="pad padR">
    <button class="cb" data-k="down">▼</button>
    <button class="cb" data-k="up">▲</button>
  </div>
</div>

<!-- 机库 / Hangar -->
<div id="hangar" class="hide">
  <div class="hbar"><b data-i18n="hangar"></b><span class="gold" id="hFunds"></span><button class="tb" id="hRover" data-i18n="rover"></button><button class="tb" id="hBack" data-i18n="back"></button></div>
  <div class="hmain">
    <canvas id="hcv"></canvas>
    <div id="hstats" class="scroll"></div>
    <div id="hsel" class="hide"><span id="hselName"></span><button class="mini" id="selUp">▲</button><button class="mini" id="selDown">▼</button><button class="mini" id="selDel">✕</button></div>
  </div>
  <div style="font-size:11px;color:#9fb3e6;padding:4px 2px 0" data-i18n="tapHint"></div>
  <div id="palette" class="scroll"></div>
  <div class="hfoot"><button class="mb alt" id="hDefault" data-i18n="defaultRocket"></button><button class="mb alt" id="hClear" data-i18n="clear"></button><button class="mb" id="hLaunch" data-i18n="launch"></button></div>
</div>

<!-- 主菜单 / Main menu -->
<div class="ov" id="ovMenu">
  <div class="panel scroll">
    <h1 data-i18n="title"></h1>
    <div class="sub" id="menuSub"></div>
    <div class="kv"><span data-i18n="funds"></span><span class="gold" id="menuFunds">0</span></div>
    <div class="kv"><span data-i18n="best"></span><span class="gold" id="menuBest">0</span></div>
    <button class="mb" id="btnStart" data-i18n="start"></button>
    <button class="mb alt" id="btnRover" data-i18n="rover"></button>
    <button class="mb alt" id="btnAch" data-i18n="ach"></button>
    <button class="mb alt" id="btnAbout" data-i18n="about"></button>
    <a class="mb alt" id="btnProject" href="https://github.com/yydemo/star-chain-earn-mine" target="_blank" rel="noopener" data-i18n="project" style="display:block;text-align:center;text-decoration:none"></a>
    <p data-i18n="how"></p>
    <p style="font-size:12px;color:#7f8fbf" data-i18n="keys"></p>
  </div>
</div>
<!-- CMR 升级与零件解锁 / CMR upgrades and part unlocks -->
<div class="ov hide" id="ovShop">
  <div class="panel scroll">
    <h2 data-i18n="roverTitle"></h2>
    <div class="kv"><span data-i18n="funds"></span><span class="gold" id="shopFunds">0</span></div>
    <div class="kv"><span id="shopMass"></span></div>
    <div id="shopList"></div>
    <h3 data-i18n="partsShop"></h3>
    <div id="shopParts"></div>
    <button class="mb" id="shopHangar" data-i18n="start"></button>
    <button class="mb alt" id="shopBack" data-i18n="back"></button>
  </div>
</div>
<!-- 里程碑 / Milestones -->
<div class="ov hide" id="ovAch">
  <div class="panel scroll">
    <h2 data-i18n="ach"></h2>
    <div id="achList"></div>
    <button class="mb alt" id="achBack" data-i18n="back"></button>
  </div>
</div>
<!-- 模拟市场 / Simulated market -->
<div class="ov hide" id="ovMarket">
  <div class="panel scroll">
    <h2 data-i18n="market"></h2>
    <p data-i18n="marketDisclaimer"></p>
    <div id="marketList"></div>
    <button class="mb alt" id="marketBack" data-i18n="back"></button>
  </div>
</div>
<!-- 关于 / About -->
<div class="ov hide" id="ovAbout">
  <div class="panel scroll">
    <h2 data-i18n="about"></h2>
    <p data-i18n="aboutText"></p>
    <p><a href="https://github.com/yydemo/star-chain-earn-mine" target="_blank" rel="noopener">github.com/yydemo/star-chain-earn-mine</a><br>
       <a href="https://github.com/yydemo/moon-miner" target="_blank" rel="noopener">github.com/yydemo/moon-miner</a></p>
    <button class="mb alt" id="aboutBack" data-i18n="back"></button>
  </div>
</div>
<!-- 结果 / Result -->
<div class="ov hide" id="ovResult">
  <div class="panel scroll">
    <h2 id="resTitle"></h2>
    <div id="resBody"></div>
    <div id="resBtns"></div>
  </div>
</div>
<!-- 暂停 / Pause -->
<div class="ov hide" id="ovPause">
  <div class="panel">
    <h2 data-i18n="paused"></h2>
    <button class="mb" id="btnResume" data-i18n="resume"></button>
    <button class="mb alt" id="btnPauseHangar" data-i18n="toHangar"></button>
    <button class="mb alt" id="btnQuit" data-i18n="menu"></button>
  </div>
</div>

<!-- moon-miner v3 capsule-nft — 原创代码，MIT / original code, MIT. 设定来源 / setting source: github.com/yydemo/star-chain-earn-mine -->
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/orbit.js"></script>
<script src="js/vessel.js"></script>
<script src="js/flight.js"></script>
<script src="js/mining.js"></script>
<script src="js/builder.js"></script>
<script src="js/main.js"></script>
</body>
</html>
